# Sample calculations from the Cboe Margin Manual (2021-11-30), transcribed as test cases.
# Numbers are the manual's; layout and field names are ours. Cases already in
# cboe_manual.toml (the maximum-loss examples, the short box and the long put butterfly)
# are not repeated.
#
# Conventions (as cboe_manual.toml, plus):
#   kind:        which engine function the case exercises; spread when absent
#   basis:       initial or maintenance (default maintenance). The manual's option
#                samples are computed at the time the position is established; with
#                premium equal to market value the two bases agree for options.
#   product:     equity (stock, ETF, ETN), narrow_index or broad_index; default equity
#   style, listing: default american, listed
#   leverage:    leveraged ETF factor, which scales the short-option percentages
#   underlying:  price of the options' underlying (an index value for index options)
#   as_of, expiry: the manual gives a month and the time to expiration; the years and
#                days here are ours, chosen to match. Day-level dates matter only for
#                the nine-month test on long options.
#   reduced:     the leg is a reduced-value index option on index/reduced (XSP vs SPX);
#                its strike and premium are as quoted, and the engine converts it to
#                units of the full index
#   stock legs:  type = "stock", qty in shares, price per share
#   netted:      net intrinsic value at each distinct strike, in strike order
#   requirement: the manual's "Margin Requirement"
#   underlying_requirement: the manual's maintenance requirement on the stock leg of a
#                hedged-underlying position
#   short_proceeds: short sale proceeds that may be applied (short options and short stock)
#   margin_call: the manual's "SMA Debit or Margin Call"
#   box_margin:  the European long box's "Margin Requirement" (50% of the strike difference)
#
# A spread case with a requirement is checked as a spread when it is valid pairwise, and
# as separately margined legs when it is not, as the manual does.

