name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install toml++ (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtomlplusplus-dev

      - name: Install toml++ (macOS)
        if: runner.os == 'macOS'
        run: brew install tomlplusplus

      # HiGHS is not installed, so the differential tests against it (about 9 minutes)
      # are skipped; they run locally.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

      - name: Fixture and structure checks
        run: |
          python3 tools/check_fixtures.py data/fixtures/cboe_manual.toml
          python3 tools/check_structure.py
